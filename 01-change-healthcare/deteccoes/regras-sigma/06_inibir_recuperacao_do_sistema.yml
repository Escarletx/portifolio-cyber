title: Exclusão de cópias de sombra ou desativação da recuperação do Windows
id: 8ebca4dc-1766-4fb4-b423-d303898a323e
status: experimental
description: |
  Detecta comandos que apagam as cópias de sombra (Volume Shadow Copies) ou desativam
  a recuperação do Windows, impedindo a restauração rápida. O BlackCat executa
  "vssadmin delete shadows /all /quiet" e "wmic shadowcopy delete" pouco antes de criptografar.
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-353a
  - https://cybersecurity.att.com/blogs/labs-research/blackcat-ransomware
author: Escarlet Lima
date: 2026-11-16
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\WMIC.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_bcdedit:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains|all:
      - 'recoveryenabled'
      - 'no'
  condition: 1 of selection_*
falsepositives:
  - Manutenção manual de disco feita por administradores (raro)
level: high
