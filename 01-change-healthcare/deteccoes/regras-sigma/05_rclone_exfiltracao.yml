title: Execução do Rclone para cópia de dados para nuvem
id: ceea9c60-48a1-4612-a564-c23f4eee4abb
status: experimental
description: |
  Detecta a execução do Rclone, ferramenta legítima de sincronização muito usada por
  grupos de ransomware para copiar grandes volumes de dados para armazenamento em nuvem.
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-353a
author: Escarlet Lima
date: 2026-11-16
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\rclone.exe'
    - Description: Rsync for cloud storage
  selection_cli:
    CommandLine|contains:
      - ' copy '
      - ' sync '
      - ' mega:'
      - '--config'
  condition: all of selection_*
falsepositives:
  - Rotinas de backup que usam Rclone de forma aprovada
level: high
